# Entry point. No `zt-ci plan go` gate: its go profile matches Go files and the Makefile
# only, so a commit touching just src/**/*.proto or openapiv2/ would upload nothing and
# drift would merge green. The checks are small enough to run on every build (ZEN-5329).
#
# This step stays on the go queue's default image. Only the checks in pipeline.ci.yml
# swap in ci-protobuf.
steps:
  - label: ":pipeline: upload"
    key: upload
    command: buildkite-agent pipeline upload .buildkite/pipeline.ci.yml
    agents: { queue: go }

  # Start developer-docs' update-pins for this commit (ZEN-5331). depends_on the upload step
  # waits for every check it uploaded, so a red master build triggers nothing. A proto merge
  # alone moves no pin -- the docs read each proto at the commit a service's go.mod names --
  # so these runs usually log "no input changed"; the service triggers carry the pin move.
  # Async and soft-fail inside the verb, so the docs can never red this build.
  - label: ":books: docs trigger"
    key: docs-trigger
    if: build.branch == pipeline.default_branch
    depends_on: [upload]
    command: zt-ci docs-trigger
    soft_fail: true
    agents: { queue: go }
